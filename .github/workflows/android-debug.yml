name: Build Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || true
          command -v java
          java -version
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Validate web application
        run: npm run check
      - name: Generate Android native project
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Generate native app icon from approved Durusi branding
        run: |
          npm install --no-save --no-package-lock --ignore-scripts sharp
          node scripts/generate-native-icons.cjs
      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Durusi-Android-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Durusi-Android-build-diagnostics
          path: |
            android/**/build/reports/**
            android/.gradle/**
          if-no-files-found: ignore
