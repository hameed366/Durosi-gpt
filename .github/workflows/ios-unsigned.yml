name: Build iOS Device IPA (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-unsigned.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate web application
        run: npm run check
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync web assets
        run: npx cap sync ios
      - name: Inspect generated Xcode workspace and schemes
        run: |
          ls -la ios/App
          xcodebuild -list -workspace ios/App/App.xcworkspace
      - name: Build for physical iOS devices without signing
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild-device.log
      - name: Show actionable Xcode errors on failure
        if: failure()
        shell: bash
        run: |
          if [ -f xcodebuild-device.log ]; then
            echo '=== Compiler and build errors ==='
            grep -nEi '(^|[[:space:]])error:|fatal error:|BUILD FAILED|The following build commands failed|No such module|unable to|cannot find|not found' xcodebuild-device.log | tail -100 || true
            echo '=== Last 100 lines ==='
            tail -100 xcodebuild-device.log
          fi
      - name: Upload Xcode build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Durusi-iOS-device-build-log
          path: xcodebuild-device.log
          if-no-files-found: ignore
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/App.app
          zip -qry Durusi-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Durusi-iOS-iPadOS-unsigned-IPA
          path: Durusi-unsigned.ipa
          if-no-files-found: error
# Recovered project: trigger CI builds after restoration.
