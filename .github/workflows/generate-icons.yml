name: Generate Durusi app icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/durusi-approved.png'
      - '.github/workflows/generate-icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render approved icon to PNG sizes
        run: |
          npm install --no-save --no-package-lock --ignore-scripts sharp
          node <<'JS'
          const sharp=require('sharp'),fs=require('fs');
          const source=fs.readFileSync('www/durusi-approved.png');
          (async()=>{
            for(const [name,size] of [['icon-192.png',192],['icon-512.png',512],['icon-maskable-512.png',512],['apple-touch-icon.png',180]]){
              await sharp(source,{density:300}).resize(size,size).png().toFile('www/'+name);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit updated PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/icon-192.png www/icon-512.png www/icon-maskable-512.png www/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Render approved Durusi PNG app icons"
            git push
          fi
