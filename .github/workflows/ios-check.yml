name: Build iOS Simulator (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Generate native app icon from approved Durusi branding
        run: |
          npm install --no-save --no-package-lock --ignore-scripts sharp
          node scripts/generate-native-icons.cjs
      - name: Build simulator and capture diagnostic log
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild-simulator.log
      - name: Upload Xcode build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Durusi-iOS-simulator-build-log
          path: xcodebuild-simulator.log
          if-no-files-found: ignore
